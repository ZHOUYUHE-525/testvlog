<!DOCTYPE html>
<html lang="zh-CN">
<head>
<script>
const masterDict = {};
function initMasterDict() {
    if (window.hsk_data) {
        window.hsk_data.forEach(item => { masterDict[item.word.trim()] = item; });
    }
    if (window.extra_data) {
        window.extra_data.forEach(item => { masterDict[item.word.trim()] = item; });
    }
    console.log("Dictionary loaded:", Object.keys(masterDict).length);
}
window.onload = () => {
    initMasterDict();
};
(function() {
    const params = new URLSearchParams(window.location.search);
    if (!params.get('id')) {
        window.location.replace('login.html');
    }
})();
</script>

<script>
const params = new URLSearchParams(window.location.search);

let subLevelFilter = 0;

function toggleWordMode() {
    isWordMode = !isWordMode;
    const btn = document.getElementById('wordModeBtn');
    if (isWordMode) {
        btn.classList.add('active');
        btn.innerHTML = `<i class="fas fa-book-open"></i> <span data-i18n="word_mode_on">${uiDict[currentLang].word_mode_on || "查词: 开"}</span>`;
    } else {
        btn.classList.remove('active');
        btn.innerHTML = `<i class="fas fa-book-open"></i> <span data-i18n="word_mode">${uiDict[currentLang].word_mode || "查词: 关"}</span>`;
    }
    renderSubtitles();
}

function lookupWord(word, event) {
    event.stopPropagation(); 
    video.pause(); 
    const cleanWord = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()！？。，、\s]/g, "");
    if (!cleanWord) return;
    document.getElementById('overlay').classList.add('show');
    document.getElementById('dictModal').classList.add('show');
    document.getElementById('d-word').innerText = cleanWord;
    const wordData = masterDict[cleanWord];
    const levelSpan = document.getElementById('d-level');
    const meanContainer = document.getElementById('d-mean');
    if (wordData) {
        const level = String(wordData.level);
        let bgColor = '#fef3c7', textColor = '#d97706'; 
        if (level === '1' || level === '2' || level === '3') { bgColor = '#d1fae5'; textColor = '#059669'; }
        else if (level === '4') { bgColor = '#e0f2fe'; textColor = '#0369a1'; }
        else if (level === '5') { bgColor = '#ede9fe'; textColor = '#7c3aed'; }
        else if (level === '6') { bgColor = '#fee2e2'; textColor = '#e11d48'; }
        levelSpan.innerText = level === 'extra' ? 'EXTRA' : `HSK ${level}`;
        levelSpan.style.background = bgColor;
        levelSpan.style.color = textColor;
        levelSpan.style.display = 'inline-block';
        document.getElementById('d-pinyin').innerText = wordData.pinyin;
        let html = '';
        html += `<div style="font-weight:bold; font-size:19px; color:#333; margin-bottom:4px;">${wordData.ru}</div>`;
        if (wordData.en) {
            html += `<div style="font-size:14px; color:#666; margin-bottom:12px; border-bottom:1px solid #eee; padding-bottom:8px;">🇺🇸 ${wordData.en}</div>`;
        }
        if(wordData.phrases && wordData.phrases.length > 0) {
            html += `<div style="font-size:13px; color:#555; margin-bottom:12px; background:#f3f4f6; padding:8px; border-radius:8px;"><span style="color:#0369a1;">◆</span> ${wordData.phrases.join('， ')}</div>`;
        }
        if(wordData.examples && wordData.examples.length > 0) {
            const ex = wordData.examples[0]; 
            html += `<div style="font-size:13px; color:#444; background:#fffdf0; padding:10px; border-radius:10px; border-left:4px solid #f59e0b; line-height:1.5; margin-bottom:10px;"><div style="font-weight:bold; color:#222; font-size:15px;">${ex.hz}</div><div style="color:#888; font-family:monospace; font-size:12px;">${ex.py}</div><div style="margin-top:2px;">${currentLang === 'ru' ? ex.ru : (ex.en || ex.ru)}</div></div>`;
        }
        html += `<div style="margin-top:15px; display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><a href="https://bkrs.info/slovo.php?ch=${cleanWord}" target="_blank" class="dict-btn-link">🇷🇺 BKRS</a><a href="https://chinese.yabla.com/chinese-english-pinyin-dictionary.php?define=${cleanWord}" target="_blank" class="dict-btn-link" style="background:#fce7f3; color:#be185d;">🇺🇸 Yabla</a></div><button onclick="addToNotebook('${cleanWord}')" class="dict-btn-add" style="width:100%; margin-top:10px; height:45px;">⭐ ${uiDict[currentLang].add_to_notebook}</button><a href="review.html" style="text-decoration:none; display:block; margin-top:8px; text-align:center; font-size:12px; color:#16a34a; font-weight:bold;">📖 ${uiDict[currentLang].view_notebook} →</a>`;
        meanContainer.innerHTML = html;
    } else {
        levelSpan.style.display = 'none';
        document.getElementById('d-pinyin').innerText = "---";
        meanContainer.innerHTML = `<div style="color:#999; padding:20px; text-align:center;"><i class="fas fa-question-circle" style="font-size:30px; display:block; margin-bottom:10px;"></i>Not found</div><div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><a href="https://bkrs.info/slovo.php?ch=${cleanWord}" target="_blank" class="dict-btn-link">🇷🇺 BKRS</a><a href="https://chinese.yabla.com/chinese-english-dictionary.php?define=${cleanWord}" target="_blank" class="dict-btn-link" style="background:#fce7f3; color:#be185d;">🇺🇸 Yabla</a></div>`;
    }
}

function addToNotebook(word) {
    let vocabList = JSON.parse(localStorage.getItem('my_vocab_list') || '[]');
    if (vocabList.includes(word)) {
        alert(`"${word}" is already in your notebook!`);
        return;
    }
    vocabList.push(word);
    localStorage.setItem('my_vocab_list', JSON.stringify(vocabList));
    let vocabMeta = JSON.parse(localStorage.getItem('my_vocab_meta') || '{}');
    const now = Date.now();
    if (!vocabMeta[word]) {
        vocabMeta[word] = { created: now, nextReview: now, level: 0, note: "" };
        localStorage.setItem('my_vocab_meta', JSON.stringify(vocabMeta));
    }
    alert(`✅ Added "${word}"!`);
}

function closeDict() {
    document.getElementById('overlay').classList.remove('show');

    document.getElementById('vModal').style.display = 'block';
}

function closeVocabModal() {
    document.getElementById('vOverlay').style.display = 'none';
    document.getElementById('vModal').style.display = 'none';
}

function goToPrintLibrary() {
    if (confirm(uiDict[currentLang].print_confirm)) {

}

function renderVocabLevels() {
    const container = document.getElementById('vBodyContent');
    const data = lesson.vocab_levels;
    if (!data) return;
    let html = '';
    const categories = [

// 词汇等级着色辅助
function getWordLevelClass(word) {
    if (subLevelFilter === 0) return '';
    if (!/[\u4e00-\u9fa5]/.test(word)) return '';
    const entry = masterDict[word];
    if (!entry) return 'wl-ex';   // 未收录 → 绿色
    const lvStr = String(entry.level);
    if (lvStr === 'extra') return 'wl-ex';
    const lv = parseInt(lvStr);
    if (isNaN(lv) || lv <= subLevelFilter) return ''; // 在 filter 以内，不标色
    // 超出 filter 的词，按实际等级着色
    if (lv <= 3) return 'wl-3';   // HSK 1-3 → 绿色（理论上不会出现，因为 filter≥2）
    if (lv === 4) return 'wl-4';  // HSK 4 → 蓝色
    if (lv === 5) return 'wl-5';  // HSK 5 → 紫色
    if (lv === 6) return 'wl-6';  // HSK 6 → 红色
    return 'wl-79';               // HSK 7-9 → 橙色
}

function renderSubtitles() {
    list.innerHTML = '';
    window.currentSubtitles.forEach((sub, index) => {
        const div = document.createElement('div');
        div.className = 'sub-item';
        div.id = 'sub-' + index;

        // 分词数组
        let words = [];
        if (sub.cn.includes('/')) {
            words = sub.cn.split('/').filter(w => w.trim() !== '');
        } else if (window.Intl && Intl.Segmenter) {
            const seg = new Intl.Segmenter('zh-CN', { granularity: 'word' });
            words = Array.from(seg.segment(sub.cn)).map(s => s.segment).filter(s => s.trim());
        } else {
            words = [sub.cn.replace(/\//g, '')];
        }

        let chineseContent = '';
        const sq = searchState.query;
        const isTextSearch = sq && !searchState.isGrammar;

        if (isWordMode || subLevelFilter > 0) {
            words.forEach(word => {
                const cleanWord = word.replace(/\//g, '');
                if (!cleanWord) return;
                const lvCls = getWordLevelClass(cleanWord);
                // 搜索高亮
                let display = cleanWord;
                if (isTextSearch && cleanWord.includes(sq)) {
                    display = cleanWord.split(sq).join('<mark class="search-hit">' + sq + '</mark>');
                }
                if (isWordMode) {
                    chineseContent += `<span class="word-span ${lvCls}" onclick="lookupWord('${cleanWord}', event)">${display}</span>`;
                } else {
                    chineseContent += `<span class="${lvCls}">${display}</span>`;
                }
            });
        } else {
            let plain = sub.cn.replace(/\//g, '');
            if (isTextSearch && plain.includes(sq)) {
                plain = plain.split(sq).join('<mark class="search-hit">' + sq + '</mark>');
            }
            chineseContent = plain;
        }

        // 有预制 → 铅笔; 无预制 → 搜索（一句一图标）
        const hasPremade = (sub.analysis && (sub.analysis.ru || sub.analysis.en)) || (sub.grammar_tags && sub.grammar_tags.length > 0);
        let iconHtml = '';
        if (hasPremade) {
            iconHtml = `<div class="sent-icon-wrap" onclick="openSentenceModal(${index},'premade',event)" title="${uiDict[currentLang].tip_grammar}"><div class="icon-note"><i class="fas fa-pencil-alt"></i></div></div>`;
        } else {
            iconHtml = `<div class="sent-icon-wrap" onclick="openSentenceModal(${index},'ai',event)" title="${uiDict[currentLang].tip_ai}"><div class="icon-search"><i class="fas fa-search"></i></div></div>`;
        }

        // 搜索匹配高亮整行
        if (searchState.matchedIndices.includes(index)) div.classList.add('search-matched');

        let transText = currentLang === 'ru' ? sub.ru : (sub.en || sub.ru);
        div.innerHTML = `<div class="pinyin">${sub.py || ''}</div><div class="chinese">${chineseContent}${iconHtml}</div><div class="trans">${transText || ''}</div>`;
        div.onclick = (e) => {
            if (!isWordMode && !e.target.closest('.sent-icon-wrap')) {
                video.currentTime = sub.start;
                video.play();
            }
        };
        list.appendChild(div);
    });
}

// 搜索
function handleSubSearch(q) {
    q = q.trim();
    searchState.query = q;
    searchState.matchedIndices = [];
    searchState.currentMatch = 0;
    searchState.isGrammar = false;
    const tip = document.getElementById('searchResultTip');
    if (!q) { tip.textContent = ''; renderSubtitles(); return; }
    const subs = window.currentSubtitles;
    const gDB = (typeof GRAMMAR_DB !== 'undefined') ? GRAMMAR_DB : window.GRAMMAR_DB;
    // 语法搜索
    let grammarMatches = [];
    if (gDB) {
        grammarMatches = gDB.filter(g =>
            (g.id && g.id.toLowerCase().includes(q.toLowerCase())) ||
            (g.title && g.title.cn && g.title.cn.includes(q)) ||
            (g.keywords && Array.isArray(g.keywords) && g.keywords.some(k => k.includes(q)))
        );
    }
    if (grammarMatches.length > 0) {
        searchState.isGrammar = true;
        const ids = new Set(grammarMatches.map(g => g.id));
        subs.forEach((sub, i) => {
            const tags = sub.grammar_tags || [];
            if (tags.some(t => ids.has(typeof t === 'string' ? t : t.tagId))) searchState.matchedIndices.push(i);
        });
        tip.textContent = searchState.matchedIndices.length > 0 ? `语法 ${searchState.matchedIndices.length} 句` : '无匹配';
    } else {
        subs.forEach((sub, i) => {
            if (sub.cn.replace(/\//g, '').includes(q)) searchState.matchedIndices.push(i);
        });
        tip.textContent = searchState.matchedIndices.length > 0 ? `共 ${searchState.matchedIndices.length} 处` : '无匹配';
    }
    renderSubtitles();
}

function jumpToSearchResult() {
    if (!searchState.matchedIndices.length) return;
    const idx = searchState.matchedIndices[searchState.currentMatch % searchState.matchedIndices.length];
    searchState.currentMatch++;
    document.getElementById('sub-' + idx)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.getElementById('searchResultTip').textContent =
        `${(searchState.currentMatch-1) % searchState.matchedIndices.length + 1} / ${searchState.matchedIndices.length}`;
}

        transition: top 0.8s cubic-bezier(0.25, 1, 0.5, 1), left 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.15s;
        filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.5)); /* 加强阴影，在任何背景都清晰 */
    }
    .cursor-click-ripple {
        position: fixed; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(229, 204, 132, 0.7); z-index: 99999;
        pointer-events: none; transform: translate(-50%, -50%) scale(0);
        animation: rippleAnim 0.6s ease-out;
    }
    @keyframes rippleAnim { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
</style>

<div id="director-panel">
    <h3>🎬 自动演示控制台 (精准分离版)</h3>
    
    <div class="dir-section">
        <div class="dir-section-title">1️⃣ 查词任务设置</div>
        <div class="dir-row"><span>查词句子 (0开始算):</span> <input type="number" id="dir-sent-word" value="1"></div>
        <div class="dir-row"><span>点第几个词 (1开始算):</span> <input type="number" id="dir-word-idx" value="2"></div>
    </div>

    <div class="dir-section">
        <div class="dir-section-title">2️⃣ 语法任务设置</div>
        <div class="dir-row"><span>语法句子 (0开始算):</span> <input type="number" id="dir-sent-grammar" value="3"></div>
    </div>

    <div class="dir-section">
        <div class="dir-section-title">节奏控制</div>
        <div class="dir-row"><span>鼠标速度 (毫秒):</span> <input type="number" id="dir-speed" value="500"></div>
        <div class="dir-row"><span>弹窗展示 (毫秒):</span> <input type="number" id="dir-stay" value="1000"></div>
    </div>

    <button class="dir-btn" onclick="startDirector()">🎥 3秒后开始演出</button>
    <button onclick="document.getElementById('director-panel').style.display='none'" style="width:100%; background:transparent; border:none; color:#888; margin-top:8px; cursor:pointer; font-size:12px; text-decoration:underline;">隐藏控制台</button>
</div>

<script>
    // 💡 呼出机关：连续点击 5 次【视频标题】
    let titleClicks = 0;
    document.getElementById('lessonTitle').addEventListener('click', () => {
        titleClicks++;
        if (titleClicks >= 5) {
            document.getElementById('director-panel').style.display = 'block';
            titleClicks = 0;
        }
        setTimeout(() => titleClicks = 0, 2000); 
    });

    const wait = ms => new Promise(res => setTimeout(res, ms));

    async function startDirector() {
        const sentWord = parseInt(document.getElementById('dir-sent-word').value);
        const wordIdx = parseInt(document.getElementById('dir-word-idx').value);
        const sentGrammar = parseInt(document.getElementById('dir-sent-grammar').value);
        const moveSpeed = parseInt(document.getElementById('dir-speed').value);
        const stayTime = parseInt(document.getElementById('dir-stay').value);
        
        document.getElementById('director-panel').style.display = 'none';
        await wait(3000); // 给你3秒钟藏好真鼠标并开始录屏

        let cursor = document.getElementById('fake-cursor');
        if (!cursor) {
            cursor = document.createElement('div');
            cursor.id = 'fake-cursor';
            document.body.appendChild(cursor);
        }
        cursor.style.opacity = '1';
        cursor.style.transitionDuration = moveSpeed + 'ms';

        // 核心动作函数：移动并点击
        async function act(selector, description, clickOffset = {x: 0, y: 0}) {
            console.log("👉 动作: " + description);
            const el = document.querySelector(selector);
            if (!el) { console.warn("❌ 找不到元素: " + selector); return false; }

            const updatedRect = el.getBoundingClientRect();
            const targetX = updatedRect.left + updatedRect.width / 2 + clickOffset.x;
            const targetY = updatedRect.top + updatedRect.height / 2 + clickOffset.y;
            
            cursor.style.top = targetY + 'px';
            cursor.style.left = targetX + 'px';
            await wait(moveSpeed); 
            
            // 点击波纹特效
            cursor.style.transform = 'scale(0.8)';
            const ripple = document.createElement('div');
            ripple.className = 'cursor-click-ripple';
            ripple.style.left = targetX + 'px';
            ripple.style.top = targetY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            await wait(150);
            cursor.style.transform = 'scale(1)';
            el.click(); 
            await wait(500); 
            return true;
        }

        // 🌟 核心新功能：模拟真人拖拽滑动 🌟
        async function simulateDragScroll(targetSelector, description) {
            console.log("👉 动作: 模拟滑动到 " + description);
            const el = document.querySelector(targetSelector);
            const list = document.querySelector('.subtitle-list');
            if (!el || !list) return;

            // 1. 把鼠标移动到字幕列表的中心偏下一点
            const listRect = list.getBoundingClientRect();
            cursor.style.top = (listRect.top + listRect.height * 0.7) + 'px';
            cursor.style.left = (listRect.left + listRect.width / 2) + 'px';
            await wait(moveSpeed);

            // 2. 模拟按下鼠标 (按住)
            cursor.style.transform = 'scale(0.8)';
            await wait(300);

            // 3. 模拟向上拖拽 (页面向下滑动)
            cursor.style.top = (listRect.top + listRect.height * 0.3) + 'px';
            
            // 4. 同步让页面丝滑滚动
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            await wait(800); // 等待拖拽和滚动完成

            // 5. 松开鼠标
            cursor.style.transform = 'scale(1)';
            await wait(400);
        }

        // ==========================================
        // 🎬 剧本开始 (The Show)
        // ==========================================

        // 【第一幕】：展示字幕自由开关 (增加汉字开关)
        await act('.sub-header .toggle-circle:nth-child(1)', '关拼音');
        await wait(100);
        await act('.sub-header .toggle-circle:nth-child(2)', '关汉字'); // ✅ 新增关汉字
        await wait(100);
        await act('#transToggle', '关翻译');
        await wait(100);
        
        await act('.sub-header .toggle-circle:nth-child(1)', '开拼音');
        await wait(100);
        await act('.sub-header .toggle-circle:nth-child(2)', '开汉字'); // ✅ 新增开汉字
        await wait(100);
        await act('#transToggle', '开翻译');
        await wait(100);

        // 【第二幕】：寻找查词句 -> 播放 -> 查词
        await simulateDragScroll('#sub-' + sentWord, '查词目标句'); 
        await act('#sub-' + sentWord, '点击查词目标句跳转');
        await wait(1000); // 假装听2秒

        await act('#wordModeBtn', '开启查词模式');
        await wait(100);
        const wordSelector = `#sub-${sentWord} .chinese .word-span:nth-child(${wordIdx})`;
        await act(wordSelector, '点击查词');
        await wait(stayTime); // 停留看解释

        await act('#dictModal .dict-close', '关闭词典');
        await wait(100);
        await act('.btn-play', '恢复播放'); 
        await wait(100);
        
        // 🛑 必须关闭查词模式，否则影响点击下一句
        await act('#wordModeBtn', '关闭查词模式');
        await wait(200);

        // 【第三幕】：寻找语法句 -> 播放 -> 查语法
        await simulateDragScroll('#sub-' + sentGrammar, '语法目标句');
        await act('#sub-' + sentGrammar, '点击语法目标句跳转');
        await wait(2000); // 假装听2秒

        const grammarIconSelector = `#sub-${sentGrammar} .sent-icon-wrap`;
        await act(grammarIconSelector, '打开语法解析');
        await wait(1000); 
        
        // 模拟真人下滑语法弹窗看更多内容
        const grammarBody = document.getElementById('sentBodyContent');
        if (grammarBody) {
            grammarBody.scrollTo({top: 150, behavior: 'smooth'});
            await wait(1000);
        }

        // 寻找并假点击“跳转语法库”按钮
        const grammarLibBtn = document.querySelector('#sentModal .g-item-btn');
        if (grammarLibBtn) {
            const realHref = grammarLibBtn.href;
            grammarLibBtn.removeAttribute('href'); // 拔掉链接防跳出
            await act('#sentModal .g-item-btn', '假点击语法库');
            await wait(1000); 
            grammarLibBtn.href = realHref; // 恢复链接
        }

        await act('#sentModal .dict-close', '关闭语法');
        await wait(400);
        await act('.btn-play', '恢复播放');
        await wait(1000);

        // 【第四幕】：沉浸式纯音频
        await act('#audioModeBtn', '开启纯音频');
        await wait(300);
        await act('#fullscreenBtn', '开启全屏');
        
        await wait(stayTime); // 让观众感受几秒
        
        await act('#fullscreenBtn', '关闭全屏');
        await act('#audioModeBtn', '关闭纯音频');

        // ==========================================
        console.log("✅ 完美杀青！");
        cursor.style.opacity = '0'; 
        await wait(3000);
        document.getElementById('director-panel').style.display = 'block'; 
    }
</script>
<!-- ========================================== -->
</body>
