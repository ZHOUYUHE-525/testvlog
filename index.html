const masterDict = {};

function initMasterDict() {
    // 1. 装入 HSK 1-9 级词库

        window.hsk_data.forEach(item => { masterDict[item.word.trim()] = item; });

    }
    console.log("✅ 全局大词典初始化成功，共收录词条:", Object.keys(masterDict).length);
}

// 在 window.onload 中第一时间调用

        if (level === '1' || level === '2' || level === '3') { bgColor = '#d1fae5'; textColor = '#059669'; }
        else if (level === '4') { bgColor = '#e0f2fe'; textColor = '#0369a1'; }
        else if (level === '5') { bgColor = '#ede9fe'; textColor = '#7c3aed'; }
        else if (level === '6') { bgColor = '#fee2e2'; textColor = '#e11d48'; }

        levelSpan.innerText = level === 'extra' ? 'EXTRA' : `HSK ${level}`;
        levelSpan.style.background = bgColor;
        levelSpan.style.color = textColor;
        levelSpan.style.display = 'inline-block';

        // --- B. 设置拼音 ---

        // 3. 标准例句 (黄色卡片样式 - 只显示第一条)

        function addToNotebook(word) {
            // 1. 读取旧列表
            let vocabList = JSON.parse(localStorage.getItem('my_vocab_list') || '[]');
            
            // 2. 查重
            if (vocabList.includes(word)) {
                alert(`"${word}" 已经在你的生词本里啦！`);
                return;
            }
            
            // 3. 保存到列表
            vocabList.push(word);
            localStorage.setItem('my_vocab_list', JSON.stringify(vocabList));

            // 4. 🟢 关键：同时初始化“元数据” (让复习页能立即识别)
            let vocabMeta = JSON.parse(localStorage.getItem('my_vocab_meta') || '{}');
            const now = Date.now();
            // 如果 Meta 里没有这个词，就初始化它
            if (!vocabMeta[word]) {
                vocabMeta[word] = { 
                    created: now,      // 创建时间
                    nextReview: now,   // 下次复习时间 (立即)
                    level: 0,          // 记忆等级 0
                    note: ""           // 笔记
                };
                localStorage.setItem('my_vocab_meta', JSON.stringify(vocabMeta));
            }
            
            // 5. 反馈
            alert(`✅ 已将 "${word}" 加入生词本！\n(当前共 ${vocabList.length} 个词)`);
        }

            // 1. 设置弹窗顶部的【注释】或【AI分析】标题
            const modalTitle = type === 'premade' ? lang.tip_grammar : lang.tip_ai;
            // 🌟 设置弹窗标题图标
            const titleIcon = type === 'premade' ? '<i class="fas fa-pencil-alt" style="color:#8B3A3A"></i> ' : '<i class="fas fa-search" style="color:#7C3AED"></i> ';
            document.getElementById('sent-modal-title').innerHTML = titleIcon + modalTitle;

            if (type === 'premade') {
                let html = '';
                
                // 2. 渲染【语境分析】区域
                if (sub.analysis) {
                    const text = currentLang === 'ru' ? (sub.analysis.ru || sub.analysis.cn) : (sub.analysis.en || sub.analysis.cn);
                    const formattedText = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    
                    html += `<div class="analysis-box" style="border-left-color:var(--primary)">
                                <div style="font-size:11px; color:var(--primary); font-weight:bold; margin-bottom:8px; text-transform:uppercase;">${lang.context_title}</div>
                                ${formattedText}
                             </div>`;
                }

                // 3. 渲染【相关知识点】区域
                if (sub.grammar_tags && sub.grammar_tags.length > 0) {
                    html += `<div style="font-size:12px; color:#999; margin:20px 0 10px 0; font-weight:bold; border-top:1px solid #eee; padding-top:15px;">${lang.points_title}</div>`;
                    
                    const gDB = typeof GRAMMAR_DB !== 'undefined' ? GRAMMAR_DB : window.GRAMMAR_DB;
                    
                    sub.grammar_tags.forEach(tagId => {
                        const gData = gDB.find(item => item.id === tagId);
                        if (gData) {
                            const gTitle = gData.title[currentLang] || gData.title.cn;
                            const gShort = currentLang === 'ru' ? (gData.short_desc.ru || gData.short_desc.cn) : (gData.short_desc.en || gData.short_desc.cn);
                            
                            html += `
                                <div class="g-item-box">
                                    <div class="g-item-title">
                                        <span>${gTitle}</span>
                                        <span style="font-size:10px; background:#f3f4f6; color:#666; padding:2px 6px; border-radius:4px;">${gData.level}</span>
                                    </div>
                                    <div class="g-item-desc">${gShort}</div>
                                    <button class="g-item-btn" onclick="window.open('hsk_dashboard.html?tab=grammar&point=${encodeURIComponent(gData.title.cn)}', '_blank')">
                                        📖 ${lang.more_info}
                                    </button>
                                </div>`;
                        }
                    });
                }
                container.innerHTML = html || "Content loading...";

            } else {
                // 4. 实时 AI 模式：修复俄语加载提示
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#A855F7;"><i class="fas fa-spinner fa-spin fa-2x"></i><div style="margin-top:15px; font-weight:bold;">${lang.ai_loading}</div></div>`;
                
                const cleanCn = sub.cn.replace(/\//g, '');
                const targetLang = currentLang === 'ru' ? '俄语' : (currentLang === 'en' ? '英语' : '中文');
                const fullScript = window.currentSubtitles.map(s => s.cn.replace(/\//g, '')).join(" ");
                
                const prompt = `Context: ${fullScript}\nSentence: ${cleanCn}\nExplain this to a student in ${targetLang}. Focus on nuance, tone, and one tricky colloquial part. Be concise. No markdown code blocks.`;

                try {
                    const response = await fetch("https://api.deepseek.com/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer sk-231efa73c03e4835ba5aabdc15a204c5` },
                        body: JSON.stringify({ model: "deepseek-chat", messages: [{"role": "user", "content": prompt}], temperature: 0.4 })
                    });
                    const data = await response.json();
                    const aiAnswer = data.choices[0].message.content;
                    const formattedAiAnswer = aiAnswer.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
                    container.innerHTML = `<div class="analysis-box" style="border-left-color:#A855F7; background:#faf5ff;"><b>💡 ${lang.tip_ai}：</b><br><br>${formattedAiAnswer}</div>`;
                } catch (error) { container.innerHTML = "Error connecting to AI."; }
            }
        }
    </script>
<!-- 🎬 终极专业版：自动演示导演控制台 🎬 -->

<style>
    /* 控制台高级样式 */
    #director-panel {
        position: fixed; bottom: 20px; right: 20px; width: 360px;
        background: rgba(15, 15, 15, 0.95); color: #fff; padding: 20px;
        border-radius: 12px; border: 1px solid #E5CC84; box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        z-index: 99999; font-family: sans-serif; backdrop-filter: blur(8px);
        display: none; 
    }
    #director-panel h3 { margin: 0 0 15px 0; color: #E5CC84; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 10px;}
    .dir-section { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 12px; }
    .dir-section-title { font-size: 12px; color: #aaa; margin-bottom: 8px; text-transform: uppercase; font-weight: bold;}
    .dir-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; }
    .dir-row input { width: 50px; background: #333; border: 1px solid #666; color: white; padding: 4px; border-radius: 4px; text-align: center; font-weight: bold;}
    .dir-btn { width: 100%; background: linear-gradient(90deg, #E5CC84, #d4b158); color: #2c241f; font-weight: 900; border: none; padding: 12px; border-radius: 8px; cursor: pointer; margin-top: 5px; font-size: 14px;}
    .dir-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(229, 204, 132, 0.3); }
    
    /* 🌟 全新超清晰假鼠标 (高对比度白底黑边指针) */
    #fake-cursor {
        position: fixed; top: 50%; left: 50%; width: 36px; height: 36px;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="36" height="36"><path d="M5.5 2.5 L19.5 11 L12 13 L16 21 L12.5 23 L8.5 15 L3.5 19 Z" fill="%23ffffff" stroke="%23000000" stroke-width="1.5" stroke-linejoin="round"/></svg>');
        background-size: contain; background-repeat: no-repeat;
        z-index: 100000; pointer-events: none; opacity: 0;
        transition: top 0.8s cubic-bezier(0.25, 1, 0.5, 1), left 0.8s cubic-bezier(0.25, 1, 0.5, 1), transform 0.15s;
        filter: drop-shadow(3px 5px 6px rgba(0,0,0,0.5)); /* 加强阴影，在任何背景都清晰 */
    }
    .cursor-click-ripple {
        position: fixed; width: 40px; height: 40px; border-radius: 50%;
        background: rgba(229, 204, 132, 0.7); z-index: 99999;
        pointer-events: none; transform: translate(-50%, -50%) scale(0);
        animation: rippleAnim 0.6s ease-out;
    }
    @keyframes rippleAnim { 0% { transform: translate(-50%, -50%) scale(0); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
</style>

<div id="director-panel">
    <h3>🎬 自动演示控制台 (精准分离版)</h3>
    
    <div class="dir-section">
        <div class="dir-section-title">1️⃣ 查词任务设置</div>
        <div class="dir-row"><span>查词句子 (0开始算):</span> <input type="number" id="dir-sent-word" value="1"></div>
        <div class="dir-row"><span>点第几个词 (1开始算):</span> <input type="number" id="dir-word-idx" value="2"></div>
    </div>

    <div class="dir-section">
        <div class="dir-section-title">2️⃣ 语法任务设置</div>
        <div class="dir-row"><span>语法句子 (0开始算):</span> <input type="number" id="dir-sent-grammar" value="3"></div>
    </div>

    <div class="dir-section">
        <div class="dir-section-title">节奏控制</div>
        <div class="dir-row"><span>鼠标速度 (毫秒):</span> <input type="number" id="dir-speed" value="500"></div>
        <div class="dir-row"><span>弹窗展示 (毫秒):</span> <input type="number" id="dir-stay" value="1000"></div>
    </div>

    <button class="dir-btn" onclick="startDirector()">🎥 3秒后开始演出</button>
    <button onclick="document.getElementById('director-panel').style.display='none'" style="width:100%; background:transparent; border:none; color:#888; margin-top:8px; cursor:pointer; font-size:12px; text-decoration:underline;">隐藏控制台</button>
</div>

<script>
    // 💡 呼出机关：连续点击 5 次【视频标题】
    let titleClicks = 0;
    document.getElementById('lessonTitle').addEventListener('click', () => {
        titleClicks++;
        if (titleClicks >= 5) {
            document.getElementById('director-panel').style.display = 'block';
            titleClicks = 0;
        }
        setTimeout(() => titleClicks = 0, 2000); 
    });

    const wait = ms => new Promise(res => setTimeout(res, ms));

    async function startDirector() {
        const sentWord = parseInt(document.getElementById('dir-sent-word').value);
        const wordIdx = parseInt(document.getElementById('dir-word-idx').value);
        const sentGrammar = parseInt(document.getElementById('dir-sent-grammar').value);
        const moveSpeed = parseInt(document.getElementById('dir-speed').value);
        const stayTime = parseInt(document.getElementById('dir-stay').value);
        
        document.getElementById('director-panel').style.display = 'none';
        await wait(3000); // 给你3秒钟藏好真鼠标并开始录屏

        let cursor = document.getElementById('fake-cursor');
        if (!cursor) {
            cursor = document.createElement('div');
            cursor.id = 'fake-cursor';
            document.body.appendChild(cursor);
        }
        cursor.style.opacity = '1';
        cursor.style.transitionDuration = moveSpeed + 'ms';

        // 核心动作函数：移动并点击
        async function act(selector, description, clickOffset = {x: 0, y: 0}) {
            console.log("👉 动作: " + description);
            const el = document.querySelector(selector);
            if (!el) { console.warn("❌ 找不到元素: " + selector); return false; }

            const updatedRect = el.getBoundingClientRect();
            const targetX = updatedRect.left + updatedRect.width / 2 + clickOffset.x;
            const targetY = updatedRect.top + updatedRect.height / 2 + clickOffset.y;
            
            cursor.style.top = targetY + 'px';
            cursor.style.left = targetX + 'px';
            await wait(moveSpeed); 
            
            // 点击波纹特效
            cursor.style.transform = 'scale(0.8)';
            const ripple = document.createElement('div');
            ripple.className = 'cursor-click-ripple';
            ripple.style.left = targetX + 'px';
            ripple.style.top = targetY + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);

            await wait(150);
            cursor.style.transform = 'scale(1)';
            el.click(); 
            await wait(500); 
            return true;
        }

        // 🌟 核心新功能：模拟真人拖拽滑动 🌟
        async function simulateDragScroll(targetSelector, description) {
            console.log("👉 动作: 模拟滑动到 " + description);
            const el = document.querySelector(targetSelector);
            const list = document.querySelector('.subtitle-list');
            if (!el || !list) return;

            // 1. 把鼠标移动到字幕列表的中心偏下一点
            const listRect = list.getBoundingClientRect();
            cursor.style.top = (listRect.top + listRect.height * 0.7) + 'px';
            cursor.style.left = (listRect.left + listRect.width / 2) + 'px';
            await wait(moveSpeed);

            // 2. 模拟按下鼠标 (按住)
            cursor.style.transform = 'scale(0.8)';
            await wait(300);

            // 3. 模拟向上拖拽 (页面向下滑动)
            cursor.style.top = (listRect.top + listRect.height * 0.3) + 'px';
            
            // 4. 同步让页面丝滑滚动
            el.scrollIntoView({ behavior: "smooth", block: "center" });
            await wait(800); // 等待拖拽和滚动完成

            // 5. 松开鼠标
            cursor.style.transform = 'scale(1)';
            await wait(400);
        }

        // ==========================================
        // 🎬 剧本开始 (The Show)
        // ==========================================

        // 【第一幕】：展示字幕自由开关 (增加汉字开关)
        await act('.sub-header .toggle-circle:nth-child(1)', '关拼音');
        await wait(100);
        await act('.sub-header .toggle-circle:nth-child(2)', '关汉字'); // ✅ 新增关汉字
        await wait(100);
        await act('#transToggle', '关翻译');
        await wait(100);
        
        await act('.sub-header .toggle-circle:nth-child(1)', '开拼音');
        await wait(100);
        await act('.sub-header .toggle-circle:nth-child(2)', '开汉字'); // ✅ 新增开汉字
        await wait(100);
        await act('#transToggle', '开翻译');
        await wait(100);

        // 【第二幕】：寻找查词句 -> 播放 -> 查词
        await simulateDragScroll('#sub-' + sentWord, '查词目标句'); 
        await act('#sub-' + sentWord, '点击查词目标句跳转');
        await wait(1000); // 假装听2秒

        await act('#wordModeBtn', '开启查词模式');
        await wait(100);
        const wordSelector = `#sub-${sentWord} .chinese .word-span:nth-child(${wordIdx})`;
        await act(wordSelector, '点击查词');
        await wait(stayTime); // 停留看解释

        await act('#dictModal .dict-close', '关闭词典');
        await wait(100);
        await act('.btn-play', '恢复播放'); 
        await wait(100);
        
        // 🛑 必须关闭查词模式，否则影响点击下一句
        await act('#wordModeBtn', '关闭查词模式');
        await wait(200);

        // 【第三幕】：寻找语法句 -> 播放 -> 查语法
        await simulateDragScroll('#sub-' + sentGrammar, '语法目标句');
        await act('#sub-' + sentGrammar, '点击语法目标句跳转');
        await wait(2000); // 假装听2秒

        const grammarIconSelector = `#sub-${sentGrammar} .sent-icon-wrap`;
        await act(grammarIconSelector, '打开语法解析');
        await wait(1000); 
        
        // 模拟真人下滑语法弹窗看更多内容
        const grammarBody = document.getElementById('sentBodyContent');
        if (grammarBody) {
            grammarBody.scrollTo({top: 150, behavior: 'smooth'});
            await wait(1000);
        }

        // 寻找并假点击“跳转语法库”按钮
        const grammarLibBtn = document.querySelector('#sentModal .g-item-btn');
        if (grammarLibBtn) {
            const realHref = grammarLibBtn.href;
            grammarLibBtn.removeAttribute('href'); // 拔掉链接防跳出
            await act('#sentModal .g-item-btn', '假点击语法库');
            await wait(1000); 
            grammarLibBtn.href = realHref; // 恢复链接
        }

        await act('#sentModal .dict-close', '关闭语法');
        await wait(400);
        await act('.btn-play', '恢复播放');
        await wait(1000);

        // 【第四幕】：沉浸式纯音频
        await act('#audioModeBtn', '开启纯音频');
        await wait(300);
        await act('#fullscreenBtn', '开启全屏');
        
        await wait(stayTime); // 让观众感受几秒
        
        await act('#fullscreenBtn', '关闭全屏');
        await act('#audioModeBtn', '关闭纯音频');

        // ==========================================
        console.log("✅ 完美杀青！");
        cursor.style.opacity = '0'; 
        await wait(3000);
        document.getElementById('director-panel').style.display = 'block'; 
    }
</script>
<!-- ========================================== -->
</body>
</html>
